<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FolioLabz · Portfolio websites, built for you</title>
    <meta name="description" content="FolioLabz builds your portfolio website for you. Pick a style, fill out one form, and launch. Resume polishing too. You never touch code." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0b12'/%3E%3Cpath d='M20 46V18h24v7H29v6h13v7H29v8z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden form definitions so Netlify detects them at deploy time.
         Field names must match what the intake wizard submits. -->
    <form name="website-intake" netlify netlify-honeypot="bot-field" hidden enctype="multipart/form-data" autocomplete="off">
      <input type="text" name="bot-field" autocomplete="off" />
      <input type="text" name="name" autocomplete="name" />
      <input type="email" name="email" autocomplete="email" />
      <input type="text" name="phone" autocomplete="tel" />
      <input type="text" name="profession" autocomplete="organization-title" />
      <input type="text" name="package" autocomplete="off" />
      <input type="text" name="rush" autocomplete="off" />
      <input type="text" name="style_pick" autocomplete="off" />
      <input type="text" name="palette" autocomplete="off" />
      <input type="text" name="brand_inspo" autocomplete="off" />
      <input type="text" name="emulate_links" autocomplete="url" />
      <textarea name="bio" autocomplete="off"></textarea>
      <input type="text" name="sections" autocomplete="off" />
      <input type="text" name="socials" autocomplete="url" />
      <textarea name="extra_notes" autocomplete="off"></textarea>
      <textarea name="summary" autocomplete="off"></textarea>
      <input type="file" name="headshot" />
      <input type="file" name="resume_file" />
      <input type="file" name="logo_file" />
      <input type="file" name="project_1" />
      <input type="file" name="project_2" />
      <input type="file" name="project_3" />
      <input type="file" name="project_4" />
    </form>

    <form name="resume-intake" netlify netlify-honeypot="bot-field" hidden enctype="multipart/form-data" autocomplete="off">
      <input type="text" name="bot-field" autocomplete="off" />
      <input type="text" name="name" autocomplete="name" />
      <input type="email" name="email" autocomplete="email" />
      <input type="text" name="phone" autocomplete="tel" />
      <input type="text" name="package" autocomplete="off" />
      <input type="text" name="target_role" autocomplete="organization-title" />
      <textarea name="whats_wrong" autocomplete="off"></textarea>
      <textarea name="extra_notes" autocomplete="off"></textarea>
      <textarea name="summary" autocomplete="off"></textarea>
      <input type="file" name="resume_file" />
    </form>

    <!-- Existing-client portal requests (domain setup + edit requests). -->
    <form name="client-request" netlify netlify-honeypot="bot-field" hidden autocomplete="off">
      <input type="text" name="bot-field" autocomplete="off" />
      <input type="text" name="name" autocomplete="name" />
      <input type="email" name="email" autocomplete="email" />
      <input type="text" name="request_type" autocomplete="off" />
      <input type="text" name="domain" autocomplete="off" />
      <textarea name="domain_notes" autocomplete="off"></textarea>
      <input type="text" name="edit_type" autocomplete="off" />
      <textarea name="details" autocomplete="off"></textarea>
      <textarea name="summary" autocomplete="off"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
