[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"


# Dedicated social-share route. Browsers immediately return home; crawlers get its metadata.
[[redirects]]
  from = "/share"
  to = "/share.html"
  status = 200

# Send every route to index.html so React Router handles it
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
